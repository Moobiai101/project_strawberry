[workspace]
resolver = "2"

members = [
    "crates/strawberry-core",
    "crates/strawberry-video",
    "crates/strawberry-audio",
    "crates/strawberry-render",
    "crates/strawberry-ui",
    "crates/strawberry-ai",
    "crates/strawberry-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Project Strawberry Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/projectstrawberry/strawberry"
rust-version = "1.75"

[workspace.dependencies]
# === ECS Foundation (Bevy) ===
bevy_ecs = "0.15"
bevy_app = "0.15"
bevy_tasks = "0.15"
bevy_time = "0.15"
bevy_hierarchy = "0.15"
bevy_reflect = "0.15"
bevy_state = "0.15"

# === Graphics ===
wgpu = "23"
vello = "0.3"
kurbo = "0.11"
peniko = "0.3"
tiny-skia = "0.11"
image = "0.25"

# === Video ===
# Using FFmpeg subprocess for decode/encode (production NLE approach)
# This avoids Rust binding compatibility issues with FFmpeg 7+/8+
# FFmpeg binary required at runtime (bundled with app for distribution)

# === Audio ===
cpal = "0.15"
symphonia = "0.5"
rubato = "0.15"
dasp = "0.11"
fundsp = "0.18"
ringbuf = "0.4"
kira = "0.12"

# === Text ===
cosmic-text = "0.12"

# === Math ===
glam = { version = "0.29", features = ["serde"] }

# === Animation ===
splines = "4"
ezing = "0.1"

# === Color ===
palette = "0.7"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ron = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }


# === Async ===
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
parking_lot = "0.12"
crossbeam = "0.8"

# === AI ===
# Note: ort (ONNX Runtime) removed - requires MSVC toolchain
# For local AI, will add back when needed with proper toolchain
async-openai = "0.24"

# === UI ===
egui = "0.29"
eframe = "0.29"
egui-wgpu = "0.29"
egui_tiles = "0.10"
egui-file-dialog = "0.8"
rfd = "0.15"

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Error Handling ===
thiserror = "2"
anyhow = "1"

# === Bit Flags ===
bitflags = "2"

# === Testing ===
criterion = "0.5"
proptest = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
